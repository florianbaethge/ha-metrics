name: Kennzahlen sammeln

on:
  schedule:
    # 05:10 UTC taeglich -- laeuft sicher vor dem 06:00-UTC-Report.
    # GitHub startet geplante Laeufe oft ein paar Minuten spaeter, der
    # Puffer ist Absicht.
    - cron: "10 5 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Kennzahlen abrufen
        env:
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: python collect.py

      - name: Ergebnis committen
        run: |
          git config user.name "metrics-bot"
          git config user.email "metrics-bot@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "Keine Aenderung."
          else
            git commit -m "Kennzahlen $(date -u +%Y-%m-%d)"
            git push
          fi
